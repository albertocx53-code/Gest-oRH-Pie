<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão de RH · Sistema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="carregando" class="carregando">Carregando o banco de dados…</div>

<!-- LOGIN -->
<main id="tela-login" class="login" hidden>
  <form id="form-login" class="login-card" autocomplete="on">
    <div class="marca grande"><span class="logo"></span></div>
    <h1>Gestão de RH</h1>
    <p class="muted">Entre com sua conta</p>
    <label>Usuário<input name="usuario" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required maxlength="64"></label>
    <label>Senha<input name="senha" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required maxlength="128"></label>
    <p id="erro-login" class="erro" role="alert" hidden></p>
    <button class="btn primario largo" type="submit" id="btn-entrar">Entrar</button>
    <p class="dica">Contas de teste: <b>admin</b>, <b>rh</b> ou <b>gestor</b> · senha <b>Aurora.demo26</b></p>
  </form>
  <a class="voltar-site" href="../">← Voltar para a página do projeto</a>
</main>

<!-- SISTEMA -->
<div id="tela-sistema" class="sistema" hidden>
  <aside class="lateral">
    <div class="marca"><span class="logo"></span><div><b>Gestão de RH</b><small>Sistema web</small></div></div>
    <nav id="menu">
      <button data-tela="painel" class="ativo">Painel</button>
      <button data-tela="funcionarios">Funcionários</button>
      <button data-tela="ponto">Ponto e frequência</button>
      <button data-tela="recrutamento">Recrutamento</button>
      <button data-tela="agenda">Agenda</button>
      <button data-tela="salarios">Salários</button>
    </nav>
    <div class="lateral-rodape">
      <button class="btn fantasma pequeno" id="btn-restaurar">Restaurar dados de exemplo</button>
      <button class="btn contorno largo" id="btn-sair">Sair da conta</button>
    </div>
  </aside>

  <section class="conteudo">
    <header class="topo">
      <div>
        <h2 id="titulo-tela">Painel</h2>
        <p class="muted" id="subtitulo"></p>
      </div>
      <div class="usuario">
        <span id="selo-consulta" class="selo" hidden>Somente consulta</span>
        <div class="avatar" id="avatar"></div>
      </div>
    </header>
    <div id="area"></div>
  </section>
</div>

<!-- janela para formulários -->
<dialog id="janela">
  <form id="form-janela" method="dialog">
    <h3 id="janela-titulo"></h3>
    <div id="janela-campos" class="campos"></div>
    <p id="janela-erro" class="erro" role="alert" hidden></p>
    <div class="acoes">
      <button type="button" class="btn contorno" id="janela-cancelar">Cancelar</button>
      <button type="submit" class="btn primario" id="janela-ok">Salvar</button>
    </div>
  </form>
</dialog>

<div id="aviso" class="aviso" role="status" hidden></div>

<script src="lib/sql-wasm.js"></script>
<script src="dados.js"></script>
<script src="regras.js"></script>
<script src="app.js"></script>
</body>
</html>
